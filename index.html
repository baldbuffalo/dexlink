<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070B10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DexLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #070B10;
      --surface:    #0C1118;
      --border:     #18273A;
      --border-mid: #1E3248;
      --accent:     #00CFFF;
      --text:       #C8DCF0;
      --text-mid:   #6A8AA8;
      --muted:      #334455;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Chakra Petch', sans-serif;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,207,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,207,255,.022) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(7,11,16,.9) 100%);
      pointer-events: none;
    }

    #connect-screen {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 36px;
    }

    .wm { text-align: center; }
    .wm-title {
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 700;
      letter-spacing: .14em;
      line-height: 1;
    }
    .wm-title span { color: var(--accent); }
    .wm-rule {
      margin: 12px auto 0;
      width: 40px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .wm-sub {
      margin-top: 12px;
      font-size: 10.5px;
      font-weight: 300;
      letter-spacing: .38em;
      color: var(--text-mid);
      text-transform: uppercase;
      font-family: 'DM Mono', monospace;
    }

    .card {
      position: relative;
      width: 100%; max-width: 470px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 36px 32px 30px;
      animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-color: var(--accent);
      border-style: solid;
      opacity: .7;
    }
    .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .field { margin-bottom: 22px; }

    .field label {
      display: block;
      font-size: 9.5px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 9px;
      font-family: 'DM Mono', monospace;
    }

    .field input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-mid);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 17px;
      font-weight: 300;
      padding: 5px 0 9px;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .field input::placeholder { color: var(--muted); opacity: 1; }
    .field input:focus { border-bottom-color: var(--accent); }
    .field input[readonly] { color: var(--text-mid); cursor: default; }

    .select-wrap { position: relative; }
    .select-wrap select {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-mid);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      font-weight: 300;
      padding: 5px 24px 9px 0;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    .select-wrap select:focus { border-bottom-color: var(--accent); }
    .select-arrow {
      position: absolute;
      right: 4px; top: 50%;
      transform: translateY(-60%) rotate(90deg);
      color: var(--text-mid);
      font-size: 18px;
      pointer-events: none;
      line-height: 1;
    }

    #connect-btn {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .32em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .18s, color .18s, box-shadow .18s;
    }
    #connect-btn:hover, #connect-btn:active {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 22px rgba(0,207,255,.22);
    }
  </style>
</head>
<body>

<div id="connect-screen">
  <div class="wm">
    <div class="wm-title">Dex<span>Link</span></div>
    <div class="wm-rule"></div>
    <div class="wm-sub">Samsung DeX &middot; Tesla Browser</div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Connection</label>
        <div class="select-wrap">
          <select id="profile">
            <option value="tesla">Tesla</option>
            <option value="samsung">Samsung</option>
          </select>
          <span class="select-arrow">&#8250;</span>
        </div>
      </div>
      <div class="field">
        <label>Port</label>
        <input id="port" type="text" value="6080" readonly>
      </div>
    </div>

    <div class="field">
      <label>IP Address</label>
      <input id="ip" type="text" inputmode="url"
             autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false">
    </div>

    <button id="connect-btn">Connect</button>
  </div>
</div>

<script>
  const profile  = document.getElementById('profile');
  const ipInput  = document.getElementById('ip');
  const btn      = document.getElementById('connect-btn');
  const TESLA_IP = '192.168.43.1';

  // Restore saved Samsung IP and last profile
  let savedSamsungIp = '';
  try {
    const saved = JSON.parse(localStorage.getItem('dexlink') || '{}');
    if (saved.samsungIp) savedSamsungIp = saved.samsungIp;
    if (saved.profile)   profile.value  = saved.profile;
  } catch {}

  function applyProfile() {
    if (profile.value === 'tesla') {
      ipInput.value    = TESLA_IP;
      ipInput.readOnly = true;
      ipInput.style.color = 'var(--text-mid)';
    } else {
      ipInput.value    = savedSamsungIp;
      ipInput.readOnly = false;
      ipInput.style.color = '';
    }
  }
  applyProfile();

  profile.addEventListener('change', applyProfile);

  ipInput.addEventListener('input', () => {
    if (profile.value === 'samsung') savedSamsungIp = ipInput.value.trim();
  });

  btn.addEventListener('click', () => {
    const ip   = ipInput.value.trim() || TESLA_IP;
    const port = document.getElementById('port').value.trim() || '6080';

    try {
      localStorage.setItem('dexlink', JSON.stringify({
        profile: profile.value,
        samsungIp: savedSamsungIp
      }));
    } catch {}

    window.location.href = `http://${ip}:${port}`;
  });

  ipInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') btn.click();
  });
</script>

</body>
</html>
