<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070B10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DexLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #070B10;
      --surface:      #0C1118;
      --border:       #18273A;
      --border-mid:   #1E3248;
      --accent:       #00CFFF;
      --accent-dim:   rgba(0,207,255,.10);
      --accent-glow:  rgba(0,207,255,.22);
      --text:         #C8DCF0;
      --text-mid:     #6A8AA8;
      --muted:        #334455;
      --error:        #FF4060;
      --success:      #00FFA3;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Chakra Petch', sans-serif;
    }

    /* ── Background grid ───────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,207,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,207,255,.022) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* Vignette edges */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(7,11,16,.9) 100%);
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════
       CONNECT SCREEN
    ═══════════════════════════════════════════════════ */
    #connect-screen {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 36px;
    }

    /* Wordmark */
    .wm { text-align: center; }

    .wm-title {
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 700;
      letter-spacing: .14em;
      line-height: 1;
      color: var(--text);
    }
    .wm-title span { color: var(--accent); }

    .wm-rule {
      margin: 12px auto 0;
      width: 40px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .wm-sub {
      margin-top: 12px;
      font-size: 10.5px;
      font-weight: 300;
      letter-spacing: .38em;
      color: var(--text-mid);
      text-transform: uppercase;
      font-family: 'DM Mono', monospace;
    }

    /* Card */
    .card {
      position: relative;
      width: 100%; max-width: 470px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 36px 32px 30px;
      animation: fadeUp .45s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Corner brackets */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-color: var(--accent);
      border-style: solid;
      opacity: .7;
    }
    .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    /* Fields */
    .row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .field { margin-bottom: 22px; }

    .field label {
      display: block;
      font-size: 9.5px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 9px;
      font-family: 'DM Mono', monospace;
    }

    .field input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-mid);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 17px;
      font-weight: 300;
      padding: 5px 0 9px;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .field input::placeholder { color: var(--muted); opacity: 1; }
    .field input:focus { border-bottom-color: var(--accent); }

    /* Remove number input spinners */
    .field input[type=number]::-webkit-inner-spin-button,
    .field input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* Connect button */
    #connect-btn {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .32em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .18s, color .18s, box-shadow .18s;
      position: relative;
    }
    #connect-btn:not(:disabled):hover {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 22px var(--accent-glow);
    }
    #connect-btn:not(:disabled):active {
      background: var(--accent);
      color: var(--bg);
    }
    #connect-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* Status */
    #status {
      min-height: 18px;
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--text-mid);
      font-family: 'DM Mono', monospace;
      line-height: 1.6;
    }
    #status.err  { color: var(--error); }
    #status.conn { color: var(--accent); }

    .blink-dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 7px;
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.15} }

    /* Cert hint */
    #cert-hint {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: var(--text-mid);
      line-height: 1.7;
      font-family: 'DM Mono', monospace;
    }
    #cert-hint.show { display: block; }
    #cert-hint a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-dim);
    }
    #cert-hint a:hover { border-bottom-color: var(--accent); }

    /* ═══════════════════════════════════════════════════
       VNC SCREEN
    ═══════════════════════════════════════════════════ */
    #vnc-screen {
      display: none;
      position: fixed; inset: 0;
      background: #000;
      z-index: 10;
    }

    #vnc-container {
      width: 100%; height: 100%;
      overflow: hidden;
    }

    /* noVNC injects a canvas — make it fill the area */
    #vnc-container > :first-child {
      width: 100% !important;
      height: 100% !important;
    }

    /* ── HUD ─────────────────────────────────────── */
    #hud {
      position: fixed;
      bottom: 20px; right: 20px;
      display: flex; gap: 8px;
      z-index: 20;
      opacity: 0;
      transition: opacity .35s;
    }

    /* Peek indicator — always faintly visible so user knows it's there */
    #hud-peek {
      position: fixed;
      bottom: 18px; right: 20px;
      width: 28px; height: 3px;
      background: linear-gradient(90deg, transparent, var(--border-mid));
      z-index: 19;
      border-radius: 2px;
      pointer-events: none;
      transition: opacity .3s;
    }

    #hud:hover { opacity: 1; }
    #hud:hover ~ #hud-peek { opacity: 0; }

    /* Show HUD on touch (for Tesla touchscreen) */
    #hud.visible { opacity: 1; }

    .hud-btn {
      background: rgba(7, 11, 16, .92);
      border: 1px solid var(--border-mid);
      color: var(--text-mid);
      font-family: 'Chakra Petch', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .14em;
      padding: 9px 16px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
      backdrop-filter: blur(10px);
    }
    .hud-btn:hover       { border-color: var(--accent); color: var(--accent); }
    .hud-btn.red:hover   { border-color: var(--error);  color: var(--error);  }
    .hud-btn:active      { opacity: .7; }
  </style>
</head>
<body>

<!-- ══ CONNECT SCREEN ══════════════════════════════════ -->
<div id="connect-screen">

  <div class="wm">
    <div class="wm-title">Dex<span>Link</span></div>
    <div class="wm-rule"></div>
    <div class="wm-sub">Samsung DeX &middot; Tesla Browser</div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Phone IP Address</label>
        <input id="ip" type="text" inputmode="url"
               placeholder="192.168.43.1"
               autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label>Port</label>
        <input id="port" type="number" value="6080" min="1" max="65535">
      </div>
    </div>

    <div class="field">
      <label>Password <span style="opacity:.45;font-size:9px;letter-spacing:.1em">— optional</span></label>
      <input id="pass" type="password" placeholder="leave blank if none">
    </div>

    <button id="connect-btn">Connect</button>

    <div id="status"></div>
    <div id="cert-hint">
      First connection? You need to accept the self-signed cert first.<br>
      <a id="cert-link" href="#" target="_blank">Open &rarr; https://[ip]:6080</a>
      &nbsp;then tap <strong>Advanced &rarr; Proceed</strong>, then reconnect.
    </div>
  </div>

</div>

<!-- ══ VNC SCREEN ══════════════════════════════════════ -->
<div id="vnc-screen">
  <div id="vnc-container"></div>
  <div id="hud">
    <button class="hud-btn" id="fs-btn">Fullscreen</button>
    <button class="hud-btn red" id="dc-btn">Disconnect</button>
  </div>
  <div id="hud-peek"></div>
</div>

<!-- ══ SCRIPT ══════════════════════════════════════════ -->
<script type="module">
import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js';

/* ── Element refs ─────────────────────────────────── */
const cs      = document.getElementById('connect-screen');
const vs      = document.getElementById('vnc-screen');
const btn     = document.getElementById('connect-btn');
const statusEl = document.getElementById('status');
const certHint = document.getElementById('cert-hint');
const certLink = document.getElementById('cert-link');
const hud     = document.getElementById('hud');

let rfb      = null;
let hudTimer = null;

/* ── Restore saved values ─────────────────────────── */
try {
  const s = JSON.parse(localStorage.getItem('dexlink') || '{}');
  if (s.ip)   document.getElementById('ip').value   = s.ip;
  if (s.port) document.getElementById('port').value = s.port;
} catch {}

/* ── Status helper ────────────────────────────────── */
function setStatus(msg, cls = '') {
  statusEl.className = 'status ' + cls;
  statusEl.innerHTML = cls === 'conn'
    ? `<span class="blink-dot"></span>${msg}`
    : msg;
}

/* ── HUD tap-to-show (for touchscreens) ──────────── */
vs.addEventListener('click', () => {
  hud.classList.add('visible');
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => hud.classList.remove('visible'), 3000);
});

/* ── Connect ──────────────────────────────────────── */
btn.addEventListener('click', () => {
  const ip   = document.getElementById('ip').value.trim()   || '192.168.43.1';
  const port = document.getElementById('port').value.trim() || '6080';
  const pass = document.getElementById('pass').value;
  const url  = `wss://${ip}:${port}`;

  // Persist
  try { localStorage.setItem('dexlink', JSON.stringify({ ip, port })); } catch {}

  // Update cert link
  certLink.href = `https://${ip}:${port}`;
  certLink.textContent = `Open → https://${ip}:${port}`;
  certHint.classList.remove('show');

  setStatus('Connecting…', 'conn');
  btn.disabled = true;

  try {
    rfb = new RFB(
      document.getElementById('vnc-container'),
      url,
      { credentials: pass ? { password: pass } : undefined }
    );

    rfb.scaleViewport  = true;
    rfb.resizeSession  = true;
    rfb.clipViewport   = false;

    rfb.addEventListener('connect', () => {
      cs.style.display = 'none';
      vs.style.display = 'block';
      btn.disabled = false;
      setStatus('');
    });

    rfb.addEventListener('disconnect', e => {
      vs.style.display = 'none';
      cs.style.display = 'flex';
      btn.disabled = false;
      if (e.detail.clean) {
        setStatus('Disconnected');
        certHint.classList.remove('show');
      } else {
        setStatus('Connection failed — is DroidVNC-NG running with WSS enabled?', 'err');
        certHint.classList.add('show');
      }
    });

    rfb.addEventListener('credentialsrequired', () => {
      const p = prompt('Enter VNC password:') || '';
      rfb.sendCredentials({ password: p });
    });

    rfb.addEventListener('securityfailure', () => {
      setStatus('Security / auth error — check your password', 'err');
      btn.disabled = false;
    });

  } catch (err) {
    setStatus('Error: ' + err.message, 'err');
    btn.disabled = false;
  }
});

/* ── Disconnect ───────────────────────────────────── */
document.getElementById('dc-btn').addEventListener('click', () => {
  rfb?.disconnect();
});

/* ── Fullscreen ───────────────────────────────────── */
const fsBtn = document.getElementById('fs-btn');
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    fsBtn.textContent = 'Exit Full';
  } else {
    document.exitFullscreen();
    fsBtn.textContent = 'Fullscreen';
  }
});

/* ── Enter to connect ─────────────────────────────── */
['ip', 'port', 'pass'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') btn.click();
  });
});
</script>

</body>
</html>
